<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>山選び診断 | 初心者でも行ける山をかんたん検索 - Yamatch</title>
<meta name="description" content="交通手段・体力・好みの雰囲気を選ぶだけ。初心者でもすぐ行ける山が見つかる、Yamatchの山選び診断。">
<meta property="og:title" content="山選び診断 - Yamatch">
<meta property="og:description" content="5問に答えるだけで、あなたにぴったりの山が見つかる。初心者向け山選び診断。">
<meta property="og:url" content="https://tozan-navi.com/find/">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://tozan-navi.com/find/">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f0ede5;color:#3a3530;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;}
h1,h2,h3,.ym-logo,.mountain-name,.sec-title{font-family:"Zen Kaku Gothic New",-apple-system,sans-serif;}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}

/* ヘッダー */
.ym-header{background:#4e6535;position:sticky;top:0;z-index:100;}
.ym-header-inner{max-width:680px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.ym-header a{color:rgba(255,255,255,0.7);font-size:12px;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:4px;}
.ym-header-title{flex:1;font-size:16px;font-weight:700;color:white;}

/* メイン */
main{max-width:680px;margin:0 auto;padding:0 0 120px;}

/* ステップ */
.step{display:none;}
.step.active{display:block;}

/* イントロ */
.intro-hero{background:linear-gradient(160deg,#1e3a1a 0%,#2d5228 60%,#3a6832 100%);padding:32px 20px 28px;text-align:center;}
.intro-hero-icon{font-size:52px;margin-bottom:12px;}
.intro-hero-title{font-size:22px;font-weight:900;color:white;line-height:1.3;margin-bottom:8px;}
.intro-hero-sub{font-size:13px;color:rgba(255,255,255,0.7);margin-bottom:24px;}
.intro-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:24px;}
.intro-tag{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.85);font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);}
.start-btn{display:inline-flex;align-items:center;gap:8px;background:#a8d860;color:#1a3010;border:none;border-radius:14px;padding:14px 32px;font-size:16px;font-weight:800;cursor:pointer;transition:transform .12s ease;}
.start-btn:active{transform:scale(0.97);}

/* 質問 */
.q-wrap{padding:20px 16px 0;}
.progress-bar{height:4px;background:#d8d0c8;border-radius:2px;margin-bottom:20px;overflow:hidden;}
.progress-fill{height:100%;background:#4e6535;border-radius:2px;transition:width 0.35s ease;}
.q-num{font-size:11px;font-weight:700;color:#8a7a6a;letter-spacing:0.08em;margin-bottom:6px;}
.q-text{font-size:18px;font-weight:800;color:#2a2520;line-height:1.4;margin-bottom:4px;}
.q-sub{font-size:12px;color:#8a7a6a;margin-bottom:18px;}
.choices{display:flex;flex-direction:column;gap:10px;}
.choice{background:white;border:2px solid #e0dbd4;border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .12s ease,border-color .15s ease,background .15s ease;text-align:left;}
.choice:active{transform:scale(0.97);}
.choice.selected{border-color:#4e6535;background:#eef4e8;}
.choice-icon{font-size:26px;flex-shrink:0;width:36px;text-align:center;}
.choice-label{font-size:14px;font-weight:700;color:#2a2520;}
.choice-sub{font-size:11px;color:#8a7a6a;margin-top:2px;}

/* 結果 */
.result-wrap{padding:20px 16px 0;}
.result-header{text-align:center;padding:24px 16px 20px;background:linear-gradient(160deg,#1e3a1a,#2d5228);border-radius:16px;margin-bottom:20px;}
.result-header-title{font-size:13px;color:rgba(255,255,255,0.65);margin-bottom:6px;}
.result-header-main{font-size:20px;font-weight:900;color:white;line-height:1.3;}
.result-count{font-size:12px;color:rgba(255,255,255,0.55);margin-top:6px;}
.result-cards{display:flex;flex-direction:column;gap:14px;margin-bottom:24px;}
.rc{background:white;border-radius:14px;border:1px solid #e0dbd4;overflow:hidden;}
.rc-top{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;}
.rc-rank{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:white;flex-shrink:0;}
.rc-rank.r1{background:#c8962c;}
.rc-rank.r2{background:#7a9090;}
.rc-rank.r3{background:#8a7060;}
.rc-name{font-size:16px;font-weight:800;color:#2a2520;}
.rc-area{font-size:11px;color:#8a7a6a;margin-top:1px;}
.rc-badges{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 10px;}
.rb{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;}
.rb-diff{background:#eef4e8;color:#4a6838;border:0.5px solid #b0cc90;}
.rb-train{background:#e8f0fa;color:#3a5888;border:0.5px solid #a0b8e0;}
.rb-drive{background:#faf4e8;color:#7a6030;border:0.5px solid #d4b870;}
.rb-100{background:#fff4e0;color:#8a5820;border:0.5px solid #d4a860;}
.rc-reason{padding:10px 14px;border-top:1px solid #f0ede5;background:#faf9f6;}
.rc-reason-title{font-size:10px;font-weight:700;color:#8a7a6a;letter-spacing:0.06em;margin-bottom:5px;}
.rc-reason-text{font-size:12px;color:#4a4540;line-height:1.6;}
.rc-cta{display:block;margin:10px 14px 14px;background:#4e6535;color:white;text-decoration:none;border-radius:10px;padding:10px;text-align:center;font-size:13px;font-weight:700;}
.rc-cta:active{transform:scale(0.97);}

/* 空結果 */
.empty-result{text-align:center;padding:48px 20px;}
.empty-result-icon{font-size:48px;margin-bottom:12px;}
.empty-result-text{font-size:15px;color:#5a5048;margin-bottom:20px;}

/* もう一度ボタン */
.retry-btn{display:block;width:100%;margin-top:8px;background:white;border:2px solid #c8c0b4;color:#5a5048;border-radius:12px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .12s ease;}
.retry-btn:active{transform:scale(0.97);}

/* タイプ診断誘導 */
.type-nudge{background:#c8d4b8;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-decoration:none;margin-top:16px;}
.type-nudge-text{flex:1;}
.type-nudge-label{font-size:10px;font-weight:700;color:#5a6848;letter-spacing:0.06em;margin-bottom:2px;}
.type-nudge-title{font-size:13px;font-weight:700;color:#2a3020;}
.type-nudge-arrow{font-size:22px;color:#4e6535;font-weight:300;}

/* 戻るボタン */
.back-row{display:flex;align-items:center;margin-bottom:16px;}
.back-btn-q{background:none;border:none;color:#8a7a6a;font-size:13px;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;}
</style>
</head>
<body>
<header class="ym-header">
  <div class="ym-header-inner">
    <a href="/"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>戻る</a>
    <div class="ym-header-title">山選び診断</div>
  </div>
</header>
<main>

<!-- イントロ -->
<div id="step-intro" class="step active">
  <div class="intro-hero">
    <div class="intro-hero-icon">🗻</div>
    <div class="intro-hero-title">どの山に行けばいい？<br>かんたんに見つかる</div>
    <div class="intro-hero-sub">5問に答えるだけで、あなたにぴったりの山を提案</div>
    <div class="intro-tags">
      <span class="intro-tag">🚃 電車でも行ける</span>
      <span class="intro-tag">🥾 初心者OK</span>
      <span class="intro-tag">⏱ 約1分</span>
      <span class="intro-tag">💰 無料</span>
    </div>
    <button class="start-btn" onclick="startQuiz()">診断スタート →</button>
  </div>
</div>

<!-- 質問ステップ -->
<div id="step-q" class="step">
  <div class="q-wrap">
    <div class="back-row">
      <button class="back-btn-q" onclick="goBack()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        戻る
      </button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="q-num" id="q-num"></div>
    <div class="q-text" id="q-text"></div>
    <div class="q-sub" id="q-sub"></div>
    <div class="choices" id="choices"></div>
  </div>
</div>

<!-- 結果 -->
<div id="step-result" class="step">
  <div class="result-wrap">
    <div class="result-header">
      <div class="result-header-title">あなたにおすすめの山</div>
      <div class="result-header-main" id="result-headline"></div>
      <div class="result-count" id="result-count"></div>
    </div>
    <div class="result-cards" id="result-cards"></div>
    <button class="retry-btn" onclick="resetQuiz()">↺ もう一度診断する</button>
    <a class="type-nudge" href="/recommend/">
      <div class="type-nudge-text">
        <div class="type-nudge-label">あわせて試す</div>
        <div class="type-nudge-title">登山タイプ診断で自分のスタイルも知ろう</div>
      </div>
      <div class="type-nudge-arrow">›</div>
    </a>
  </div>
</div>

</main>
<script>
var QUESTIONS = [
  {
    id: 'transport',
    text: '山へはどうやって行きますか？',
    sub: '当日の交通手段を選んでください',
    choices: [
      { value: 'train', icon: '🚃', label: '電車・バスだけで行きたい', sub: '車を持っていない、または運転しない' },
      { value: 'car',   icon: '🚗', label: '車で行ける', sub: 'レンタカーや家族の車も含む' }
    ]
  },
  {
    id: 'fitness',
    text: '普段の運動量はどのくらいですか？',
    sub: '正直に答えるほど精度が上がります',
    choices: [
      { value: 'low',  icon: '🛋', label: 'ほとんど運動しない', sub: '階段より多く歩くのは週1回以下' },
      { value: 'mid',  icon: '🚶', label: '軽く歩くことはある', sub: '通勤・散歩など30分以上/日' },
      { value: 'high', icon: '🏃', label: '体を動かすのは好き', sub: 'ジムや運動習慣がある' }
    ]
  },
  {
    id: 'vibe',
    text: '山でどんな景色や体験をしたいですか？',
    sub: '一番ピンとくるものを選んでください',
    choices: [
      { value: 'view',    icon: '🏔', label: '山頂から絶景を見たい', sub: '広い眺望・空に近い感覚' },
      { value: 'forest',  icon: '🌿', label: '森の中をゆっくり歩きたい', sub: '緑・木漏れ日・静かな道' },
      { value: 'easy',    icon: '😊', label: 'とにかく気軽に登りたい', sub: '難しいことより達成感重視' },
      { value: 'highland',icon: '🌾', label: '高原・湿原など広い景色', sub: '草原・池・のびのびした風景' }
    ]
  },
  {
    id: 'time',
    text: '自宅から登山口まで何時間かけられますか？',
    sub: '車・電車どちらでも、登山口到着までの時間',
    choices: [
      { value: 'near',   icon: '⚡', label: '1〜2時間以内', sub: 'できるだけ近場がいい' },
      { value: 'middle', icon: '🕐', label: '2〜3時間くらいなら', sub: '少し遠くても行きたい山があれば' },
      { value: 'far',    icon: '🗺', label: '時間はあまり気にしない', sub: '4時間以上でもOK' }
    ]
  },
  {
    id: 'depart',
    text: '出発地はどのあたりですか？',
    sub: '一番近い拠点を選んでください',
    choices: [
      { value: 'ofuna',    icon: '🗼', label: '横浜・大船・湘南方面', sub: '神奈川中心' },
      { value: 'shinjuku', icon: '🌆', label: '新宿・渋谷・都内方面', sub: '東京中心' },
      { value: 'omiya',    icon: '🏙', label: '大宮・浦和・埼玉方面', sub: '埼玉中心' }
    ]
  }
];

var answers = {};
var currentQ = 0;
var mountainsData = [];

fetch('/data/mountains.json')
  .then(function(r){ return r.json(); })
  .then(function(data){ mountainsData = data; })
  .catch(function(){});

function startQuiz(){
  answers = {};
  currentQ = 0;
  _transitioning = false;
  show('step-q');
  renderQ();
}

function goBack(){
  if(currentQ === 0){
    show('step-intro');
  } else {
    currentQ--;
    renderQ();
  }
}

function renderQ(){
  var q = QUESTIONS[currentQ];
  document.getElementById('prog-fill').style.width = Math.round((currentQ / QUESTIONS.length) * 100) + '%';
  document.getElementById('q-num').textContent = (currentQ + 1) + ' / ' + QUESTIONS.length;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('q-sub').textContent = q.sub;
  var html = '';
  q.choices.forEach(function(c){
    var sel = answers[q.id] === c.value ? ' selected' : '';
    html += '<button class="choice' + sel + '" data-val="' + c.value + '" onclick="selectChoice(\'' + q.id + '\',\'' + c.value + '\')">';
    html += '<div class="choice-icon">' + c.icon + '</div>';
    html += '<div><div class="choice-label">' + c.label + '</div><div class="choice-sub">' + c.sub + '</div></div>';
    html += '</button>';
  });
  document.getElementById('choices').innerHTML = html;
  window.scrollTo(0, 0);
}

var _transitioning = false;
function selectChoice(qid, val){
  if(_transitioning) return;
  _transitioning = true;
  answers[qid] = val;

  document.querySelectorAll('#choices .choice').forEach(function(btn){
    btn.classList.toggle('selected', btn.getAttribute('data-val') === val);
  });

  setTimeout(function(){
    _transitioning = false;
    if(currentQ < QUESTIONS.length - 1){
      currentQ++;
      renderQ();
    } else {
      if(mountainsData.length === 0){
        // fetchがまだ終わっていない場合は待機
        var waiting = document.getElementById('choices');
        if(waiting) waiting.innerHTML = '<div style="text-align:center;padding:24px;color:#8a7a6a;">データを読み込み中...</div>';
        var check = setInterval(function(){
          if(mountainsData.length > 0){
            clearInterval(check);
            showResult();
          }
        }, 100);
      } else {
        showResult();
      }
    }
  }, 220);
}

function getDriveTime(m){
  var dep = answers.depart || 'ofuna';
  if(dep === 'shinjuku') return m.driveTimeShinjuku || m.driveTime || 999;
  if(dep === 'omiya')    return m.driveTimeOmiya    || m.driveTime || 999;
  return m.driveOfuna || m.driveTime || 999;
}

function scoreMount(m){
  var score = 0;

  // 日帰り必須
  if(!m.daytrip) return -1;

  // 難易度フィルター
  var diffOk = { '初級':3,'初〜中級':2,'中級':1 };
  var diffScore = diffOk[m.difficulty] || 0;
  if(answers.fitness === 'low'  && diffScore < 2) return -1;
  if(answers.fitness === 'mid'  && diffScore < 1) return -1;
  score += diffScore * 20;

  // 体力×coeffMax
  var coeff = m.coeffMax || 0;
  if(answers.fitness === 'low'  && coeff > 15) return -1;
  if(answers.fitness === 'mid'  && coeff > 25) return -1;
  if(answers.fitness === 'high' && coeff > 35) return -1;
  score += Math.max(0, 20 - coeff) * 2;

  // 交通手段
  if(answers.transport === 'train'){
    if(!m.trainAccess) return -1;
    score += 30;
  }

  // 移動時間
  var drive = getDriveTime(m);
  var timeLimit = 999;
  if(answers.time === 'near')   timeLimit = 120;
  if(answers.time === 'middle') timeLimit = 180;
  if(answers.transport === 'train'){
    // 電車の場合はdriveTimeで判定しない
    timeLimit = 999;
  }
  if(drive > timeLimit) return -1;
  score += Math.max(0, 200 - drive) / 5;

  // 雰囲気マッチ
  var vibes = m.vibes || [];
  var vibeMatch = {
    view:     ['view','ridge','alpine'],
    forest:   ['forest','river','historic','historical'],
    easy:     ['accessible'],
    highland: ['highland','wetland','flower']
  };
  var targets = vibeMatch[answers.vibe] || [];
  var matched = false;
  targets.forEach(function(v){ if(vibes.indexOf(v) > -1) matched = true; });
  if(matched) score += 40;
  // accessible は常にプラス
  if(vibes.indexOf('accessible') > -1) score += 10;

  return score;
}

function buildReason(m){
  var reasons = [];
  var dep = answers.depart || 'ofuna';
  var depLabel = dep === 'shinjuku' ? '新宿' : dep === 'omiya' ? '大宮' : '横浜';
  var drive = getDriveTime(m);

  if(answers.transport === 'train' && m.trainAccess){
    reasons.push('🚃 電車・バスでアクセス可（' + m.trainAccess.slice(0,30) + (m.trainAccess.length>30?'…':'') + '）');
  } else if(answers.transport === 'car') {
    reasons.push('🚗 ' + depLabel + 'から約' + drive + '分でアクセス');
  }

  var diffMap = {'初級':'初心者でも安心','初〜中級':'初心者〜中級者向け','中級':'慣れてきた人向け'};
  if(diffMap[m.difficulty]) reasons.push('🥾 難易度：' + m.difficulty + '（' + diffMap[m.difficulty] + '）');

  if(m.coeffMax){
    reasons.push('⏱ 歩行時間の目安：コース定数' + (m.coeffMin||0) + '〜' + m.coeffMax);
  }

  var vibeTexts = {
    view:'山頂からの眺望が良い',
    forest:'森林浴・静かな樹林帯',
    accessible:'観光施設や整備道が充実',
    highland:'高原・湿原の広大な景色',
    ridge:'尾根歩きで気持ちいい',
    wetland:'湿原・池塘など珍しい地形'
  };
  (m.vibes||[]).forEach(function(v){
    if(vibeTexts[v]) reasons.push('🌄 ' + vibeTexts[v]);
  });

  if(m.category === '百名山') reasons.push('🏆 日本百名山のひとつ');

  return reasons.slice(0, 3);
}

function showResult(){
  var scored = mountainsData.map(function(m){
    return { m: m, score: scoreMount(m) };
  }).filter(function(x){ return x.score > 0; })
    .sort(function(a, b){ return b.score - a.score; });

  var dep = answers.depart || 'ofuna';
  var depLabel = dep === 'shinjuku' ? '新宿・都内' : dep === 'omiya' ? '大宮・埼玉' : '横浜・大船';
  var vibeLabel = {view:'絶景が楽しめる',forest:'森歩きが気持ちいい',easy:'気軽に楽しめる',highland:'高原・湿原が広がる'}[answers.vibe] || '';
  var fitLabel = {low:'ゆっくり',mid:'マイペースで',high:'しっかり'}[answers.fitness] || '';

  document.getElementById('result-headline').textContent = depLabel + '発・' + fitLabel + '登れる山';
  document.getElementById('result-count').textContent = '条件に合う山：' + scored.length + '件中、上位3件を表示';

  var top3 = scored.slice(0, 3);
  var rankClass = ['r1','r2','r3'];

  if(top3.length === 0){
    document.getElementById('result-cards').innerHTML =
      '<div class="empty-result"><div class="empty-result-icon">🔍</div><div class="empty-result-text">条件に合う山が見つかりませんでした。<br>条件を変えて再度お試しください。</div></div>';
    document.getElementById('result-headline').textContent = '条件に合う山が見つかりませんでした';
    document.getElementById('result-count').textContent = '';
    show('step-result');
    return;
  }

  var html = '';
  top3.forEach(function(item, i){
    var m = item.m;
    var reasons = buildReason(m);
    var drive = getDriveTime(m);
    var driveStr = drive < 999 ? '🚗 ' + drive + '分' : '';
    var is100 = m.category === '百名山';

    html += '<div class="rc">';
    html += '<div class="rc-top">';
    html += '<div class="rc-rank ' + rankClass[i] + '">' + (i+1) + '</div>';
    html += '<div><div class="rc-name">' + esc(m.name) + '</div><div class="rc-area">' + esc(m.area) + ' ' + (m.elevation||'').toLocaleString() + 'm</div></div>';
    html += '</div>';
    html += '<div class="rc-badges">';
    html += '<span class="rb rb-diff">' + esc(m.difficulty||'') + '</span>';
    if(m.trainAccess) html += '<span class="rb rb-train">🚃 電車OK</span>';
    if(driveStr && answers.transport === 'car') html += '<span class="rb rb-drive">' + driveStr + '</span>';
    if(is100) html += '<span class="rb rb-100">🏆 百名山</span>';
    html += '</div>';
    if(reasons.length > 0){
      html += '<div class="rc-reason"><div class="rc-reason-title">この山をおすすめする理由</div>';
      html += '<div class="rc-reason-text">' + reasons.map(function(r){ return esc(r); }).join('<br>') + '</div>';
      html += '</div>';
    }
    html += '<a class="rc-cta" href="/mountains/' + esc(m.id) + '/">詳しく見る →</a>';
    html += '</div>';
  });

  document.getElementById('result-cards').innerHTML = html;
  show('step-result');
  window.scrollTo(0, 0);
}

function resetQuiz(){
  answers = {};
  currentQ = 0;
  show('step-intro');
  window.scrollTo(0, 0);
}

function show(id){
  document.querySelectorAll('.step').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
