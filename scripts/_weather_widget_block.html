<div class="card" id="weather-card">
    <h2><svg width="16" height="16" viewBox="0 0 24 24" style="vertical-align:-3px;margin-right:4px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4-2A5 5 0 0 0 6 19h11.5z"/></svg>山周辺の天気（直近10日間）</h2>
    <div id="weather-content" class="weather-loading">天気情報を取得中...</div>
  </div>
  <script>
  (function(){
    var MID = '__MID__';
    var CACHE_KEY = 'ym_weather_' + MID;
    var CACHE_TTL = 60 * 60 * 1000;

    var WMAP = {
      0:['☀️','快晴'],1:['🌤️','晴れ'],2:['⛅','くもり時々晴れ'],3:['☁️','くもり'],
      45:['🌫️','霧'],48:['🌫️','霧氷'],
      51:['🌦️','霧雨'],53:['🌦️','霧雨'],55:['🌦️','霧雨'],
      56:['🌧️','着氷性の霧雨'],57:['🌧️','着氷性の霧雨'],
      61:['🌧️','弱い雨'],63:['🌧️','雨'],65:['🌧️','強い雨'],
      66:['🌧️','着氷性の雨'],67:['🌧️','着氷性の雨'],
      71:['🌨️','弱い雪'],73:['🌨️','雪'],75:['❄️','強い雪'],77:['❄️','霧雪'],
      80:['🌦️','にわか雨'],81:['🌦️','にわか雨'],82:['⛈️','激しいにわか雨'],
      85:['🌨️','にわか雪'],86:['🌨️','にわか雪'],
      95:['⛈️','雷雨'],96:['⛈️','雷雨（雹あり）'],99:['⛈️','雷雨（雹あり）']
    };
    function wInfo(code){
      return WMAP[code] || ['☀️','—'];
    }
    var WD = ['日','月','火','水','木','金','土'];
    function dayLabel(dateStr, i){
      if(i===0) return '今日';
      if(i===1) return '明日';
      var parts = dateStr.split('-');
      var y = parseInt(parts[0],10), m = parseInt(parts[1],10), d = parseInt(parts[2],10);
      var wd = new Date(Date.UTC(y, m-1, d)).getUTCDay();
      return m + '/' + d + '(' + WD[wd] + ')';
    }
    function windColor(speed){
      if(speed >= 10) return 'wind-red';
      if(speed >= 5) return 'wind-yellow';
      return 'wind-green';
    }
    var COND = [
      {cls:'cond-lvl0', label:'<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#2d8a3e;margin-right:4px;vertical-align:1px"></span> 今日の登山コンディション：良好'},
      {cls:'cond-lvl1', label:'<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#d4a830;margin-right:4px;vertical-align:1px"></span> 今日の登山コンディション：注意'},
      {cls:'cond-lvl2', label:'<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#c0503a;margin-right:4px;vertical-align:1px"></span> 今日の登山コンディション：非推奨'}
    ];
    var WCODE_LEVEL2 = [95,96,99,65,67,75,82];
    var WCODE_LEVEL1 = [45,48,51,53,55,56,57,61,63,66,71,73,77,80,81,85,86];
    function judgeCondition(weatherCode, windSpeed, popPercent){
      var level = 0;
      if(WCODE_LEVEL2.indexOf(weatherCode) >= 0) level = 2;
      else if(WCODE_LEVEL1.indexOf(weatherCode) >= 0) level = Math.max(level, 1);
      if(windSpeed >= 11) level = 2;
      else if(windSpeed >= 6) level = Math.max(level, 1);
      if(popPercent >= 65) level = 2;
      else if(popPercent >= 35) level = Math.max(level, 1);
      return level;
    }
    function showError(){
      var el = document.getElementById('weather-content');
      if(el){ el.className = 'weather-error'; el.textContent = '天気情報を取得できませんでした'; }
    }
    function hourLabel(timeStr){
      var hh = timeStr.substring(11,13);
      return parseInt(hh,10) + '時';
    }
    function dayTimePeak(json, dateStr){
      if(!json.hourly || !json.hourly.time || !json.hourly.precipitation_probability) return null;
      var sum = 0, cnt = 0, peakVal = -1, peakHour = null;
      for(var i=0; i<json.hourly.time.length; i++){
        var t = json.hourly.time[i];
        if(t.substring(0,10) !== dateStr) continue;
        var hh = parseInt(t.substring(11,13), 10);
        if(hh >= 7 && hh <= 18){
          var v = json.hourly.precipitation_probability[i];
          if(v != null){
            sum += v; cnt++;
            if(v > peakVal){ peakVal = v; peakHour = hh; }
          }
        }
      }
      if(cnt === 0) return null;
      return { avg: Math.round(sum / cnt), peakVal: peakVal, peakHour: peakHour };
    }
    function buildHourlyPanel(json){
      if(!json.hourly || !json.hourly.time || !json.current || !json.current.time) return '';
      var curHourStr = json.current.time.substring(0,13) + ':00';
      var idx = json.hourly.time.indexOf(curHourStr);
      if(idx === -1) return '';
      var offsets = [0, 3, 6];
      var labels = ['現在', '3時間後', '6時間後'];
      var html = '<div class="weather-hourly-panel" id="weather-hourly-panel">';
      for(var k=0; k<offsets.length; k++){
        var idx2 = idx + offsets[k];
        if(idx2 >= json.hourly.time.length) continue;
        var t = json.hourly.time[idx2];
        var hinfo = wInfo(json.hourly.weather_code[idx2]);
        var htemp = Math.round(json.hourly.temperature_2m[idx2]);
        var hpop = json.hourly.precipitation_probability[idx2];
        var hwind = Math.round(json.hourly.wind_speed_10m[idx2]);
        var hwc = windColor(json.hourly.wind_speed_10m[idx2]);
        html += '<div class="weather-hourly-slot">';
        html += '<div class="weather-hourly-time">' + labels[k] + '（' + hourLabel(t) + '）</div>';
        html += '<div class="weather-hourly-icon">' + hinfo[0] + '</div>';
        html += '<div class="weather-hourly-temp">' + htemp + '℃</div>';
        html += '<div class="weather-hourly-sub">☔ ' + (hpop != null ? hpop : '—') + '%</div>';
        html += '<div class="weather-hourly-sub"><span class="wind-dot ' + hwc + '"></span> ' + hwind + 'm/s</div>';
        html += '</div>';
      }
      html += '</div>';
      return html;
    }
    function render(json){
      var el = document.getElementById('weather-content');
      if(!el) return;
      if(!json || !json.current || !json.daily){ showError(); return; }
      var cur = json.current;
      var todayPeak = dayTimePeak(json, json.daily.time[0]);
      var todayPop = todayPeak ? todayPeak.avg : json.daily.precipitation_probability_max[0];
      var condLevel = judgeCondition(cur.weather_code, cur.wind_speed_10m, todayPop);
      var cond = COND[condLevel];
      var html = '';
      html += '<div class="weather-condition-badge ' + cond.cls + '">' + cond.label + '</div>';
      html += '<div class="weather-days-grid">';
      var days = json.daily.time;
      for(var i=0; i<days.length && i<10; i++){
        var dinfo = wInfo(json.daily.weather_code[i]);
        var hi = Math.round(json.daily.temperature_2m_max[i]);
        var lo = Math.round(json.daily.temperature_2m_min[i]);
        var isToday = (i === 0);
        var peak = dayTimePeak(json, days[i]);
        var pop = peak ? peak.avg : null;
        if(pop == null) pop = json.daily.precipitation_probability_max[i];
        var showBadge = false;
        if(peak){
          showBadge = isToday ? ((peak.peakVal - peak.avg) >= 25) : (peak.peakVal >= 70);
        }
        html += '<div class="weather-day-card' + (isToday ? ' is-today' : '') + '"' + (isToday ? ' id="weather-today-card"' : '') + '>';
        html += '<div class="weather-day-label">' + dayLabel(days[i], i) + '</div>';
        html += '<div class="weather-day-icon">' + dinfo[0] + '</div>';
        html += '<div class="weather-day-temps">' + hi + '<span class="lo">/' + lo + '</span></div>';
        html += '<div class="weather-day-pop">☔ ' + (pop != null ? pop : '—') + '%';
        if(showBadge){
          html += '<span class="wp-badge">'
            + '<svg width="11" height="11" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#c06a1e"/><rect x="10.7" y="6" width="2.6" height="8" rx="1.3" fill="white"/><circle cx="12" cy="17" r="1.4" fill="white"/></svg>'
            + '<span class="wp-tooltip">' + peak.peakHour + '時頃、一時的に大雨の可能性あり</span>'
            + '</span>';
        }
        html += '</div>';
        if(isToday){
          html += '<div class="weather-day-tap-hint">▼ タップで時間帯別</div>';
        }
        html += '</div>';
      }
      html += '</div>';
      html += buildHourlyPanel(json);
      html += '<div class="weather-disclaimer">⚠️ 山周辺の参考値。山頂の天候とは異なる場合があります</div>';
      html += '<div class="weather-credit">Weather data by Open-Meteo.com</div>';
      el.innerHTML = html;
      var todayCard = document.getElementById('weather-today-card');
      var panel = document.getElementById('weather-hourly-panel');
      if(todayCard && panel){
        todayCard.addEventListener('click', function(){
          panel.classList.toggle('open');
        });
      }
      var grid = document.querySelector('.weather-days-grid');
      if(grid){
        function hideAllTips(){
          grid.querySelectorAll('.wp-tooltip.wp-show').forEach(function(t){ t.classList.remove('wp-show'); });
        }
        grid.addEventListener('pointerdown', function(e){
          var badge = e.target.closest('.wp-badge');
          if(!badge) return;
          e.stopPropagation();
          hideAllTips();
          var tip = badge.querySelector('.wp-tooltip');
          if(tip) tip.classList.add('wp-show');
        });
        grid.addEventListener('pointerup', function(e){
          if(e.target.closest('.wp-badge')) e.stopPropagation();
          hideAllTips();
        });
        grid.addEventListener('pointercancel', hideAllTips);
        grid.addEventListener('pointerleave', hideAllTips, true);
      }
    }
    function loadFromCache(){
      try{
        var raw = sessionStorage.getItem(CACHE_KEY);
        if(!raw) return null;
        var obj = JSON.parse(raw);
        if(!obj || !obj.ts || (Date.now() - obj.ts) > CACHE_TTL) return null;
        return obj.data;
      }catch(e){ return null; }
    }
    function saveToCache(data){
      try{ sessionStorage.setItem(CACHE_KEY, JSON.stringify({ts:Date.now(), data:data})); }catch(e){}
    }
    function fetchWeather(lat, lng, elevation){
      var url = 'https://api.open-meteo.com/v1/forecast'
        + '?latitude=' + lat
        + '&longitude=' + lng
        + '&elevation=' + elevation
        + '&current=temperature_2m,weather_code,wind_speed_10m,precipitation'
        + '&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m'
        + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max'
        + '&timezone=Asia%2FTokyo&forecast_days=10';
      fetch(url)
        .then(function(r){ if(!r.ok) throw new Error('bad status'); return r.json(); })
        .then(function(data){ saveToCache(data); render(data); })
        .catch(showError);
    }

    var cached = loadFromCache();
    if(cached){
      render(cached);
    } else {
      fetch('/data/mountains.json')
        .then(function(r){ return r.json(); })
        .then(function(list){
          var mt = list.find(function(m){ return m.id === MID; });
          if(!mt || !mt.lat || !mt.lng){ showError(); return; }
          var wLat = (mt.weatherLat != null) ? mt.weatherLat : mt.lat;
          var wLng = (mt.weatherLng != null) ? mt.weatherLng : mt.lng;
          fetchWeather(wLat, wLng, mt.elevation || 0);
        })
        .catch(showError);
    }
  })();
  </script>
