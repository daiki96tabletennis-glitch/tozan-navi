<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Myページ - Yamatch</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Helvetica Neue',sans-serif;background:#f0ede5;color:#3a3530;min-height:100vh}
.header{background:linear-gradient(155deg,#243d20 0%,#344f2c 55%,#3e5e36 100%);padding:14px 16px}
.header-inner{display:flex;align-items:center;gap:10px;max-width:480px;margin:0 auto}
.back-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:4px}
.header-title{font-size:17px;font-weight:700;color:white;flex:1}
.tabs{display:flex;background:white;border-bottom:1px solid #e0dbd4;position:sticky;top:0;z-index:10}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:12px;font-weight:600;color:#8a8078;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:#4a5e4a;border-bottom-color:#4a5e4a}
.main{max-width:480px;margin:0 auto;padding:16px}
.section{display:none}
.section.active{display:block}
.card{background:white;border-radius:12px;border:1px solid #e0dbd4;margin-bottom:10px;overflow:hidden}
.card-header{padding:12px 14px;font-size:13px;font-weight:700;color:#4a5e4a;border-bottom:1px solid #f0ede5;display:flex;align-items:center;justify-content:space-between}
.card-body{padding:12px 14px}
.empty{text-align:center;padding:32px 20px;color:#a09888;font-size:13px;line-height:1.8}
.stat-row{display:flex;gap:10px;margin-bottom:14px}
.stat-box{flex:1;background:#f5f3ef;border-radius:10px;padding:10px;text-align:center}
.stat-num{font-size:22px;font-weight:800;color:#4a5e4a}
.stat-label{font-size:10px;color:#8a8078;margin-top:2px}
/* リスト行 */
.list-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f5f3ef}
.list-item:last-child{border-bottom:none}
.list-item-name{flex:1;font-size:13px;font-weight:600;color:#3a3530}
.list-item-sub{font-size:11px;color:#8a8078;margin-top:2px}
.list-item-link{font-size:12px;color:#4a5e4a;text-decoration:none}
.del-btn{background:#fff0f0;border:1px solid #f0c0c0;border-radius:7px;padding:5px 9px;font-size:11px;color:#c05050;cursor:pointer;flex-shrink:0}
/* 追加ボタン */
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;background:#f0f5ec;border:2px dashed #c8ddb0;border-radius:10px;font-size:13px;font-weight:700;color:#4a5e4a;cursor:pointer;margin-bottom:12px}
/* モーダル */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;overflow-y:auto}
.modal-overlay.open{display:block}
.modal{background:#f0ede5;max-width:480px;margin:0 auto;min-height:100vh;padding:0 0 40px}
.modal-header{background:linear-gradient(155deg,#243d20,#344f2c);padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.modal-title{font-size:15px;font-weight:700;color:white;flex:1}
.modal-save{background:#a8d860;color:#1a3010;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:800;cursor:pointer}
.modal-close{background:rgba(255,255,255,0.15);border:none;color:white;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px}
.modal-body{padding:12px}
.form-card{background:white;border-radius:12px;padding:14px;margin-bottom:10px}
.form-card-title{font-size:11px;font-weight:700;color:#8a8078;letter-spacing:0.08em;margin-bottom:10px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:600;color:#5a5248;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:9px 11px;border:1px solid #d8d4cc;border-radius:9px;font-size:13px;background:white;color:#3a3530;outline:none;font-family:inherit}
.field input:focus,.field textarea:focus{border-color:#4a5e4a}
.field textarea{resize:vertical;min-height:70px}
/* 計画 */
.plan-card{background:white;border-radius:12px;border:1px solid #e0dbd4;margin-bottom:12px;overflow:hidden}
.plan-top{background:linear-gradient(135deg,#344f2c,#4a6038);padding:14px 16px}
.plan-name{font-size:16px;font-weight:800;color:white}
.plan-date{font-size:12px;color:rgba(255,255,255,0.7);margin-top:3px}
.plan-body{padding:14px 16px}
.plan-actions{display:flex;gap:8px;margin-top:12px}
.btn{padding:9px 16px;border-radius:9px;border:none;font-size:13px;font-weight:700;cursor:pointer}
.btn-primary{background:#4a5e4a;color:white;flex:1}
.btn-outline{background:white;border:1px solid #c8d0c0;color:#4a5e4a;flex:1}
.btn-danger{background:#fff0f0;border:1px solid #f0c0c0;color:#c05050}
.btn-new{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:14px;background:#f0f5ec;border:2px dashed #c8ddb0;border-radius:12px;font-size:14px;font-weight:700;color:#4a5e4a;cursor:pointer;margin-bottom:12px}
/* 持ち物 */
.checklist{display:flex;flex-direction:column;gap:2px}
.check-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f5f3ef}
.check-item:last-child{border-bottom:none}
.check-item input[type=checkbox]{width:17px;height:17px;accent-color:#4a5e4a;flex-shrink:0;cursor:pointer}
.check-item .item-label{font-size:13px;flex:1;cursor:pointer}
.check-item .item-del{background:none;border:none;color:#c0b8b0;font-size:16px;cursor:pointer;padding:0 4px}
.check-item.checked .item-label{color:#a09888;text-decoration:line-through}
.add-item-row{display:flex;gap:6px;margin-top:8px}
.add-item-row input{flex:1;padding:8px 10px;border:1px solid #d8d4cc;border-radius:8px;font-size:13px;outline:none}
.add-item-row button{background:#4a5e4a;color:white;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.tmpl-btns{display:flex;gap:6px;margin-bottom:10px}
.tmpl-btn{flex:1;padding:6px;border-radius:8px;border:1px solid #d8d4cc;font-size:12px;font-weight:600;color:#5a5248;background:white;cursor:pointer}
.tmpl-btn.active{background:#4a5e4a;color:white;border-color:#4a5e4a}
.copy-notice{font-size:11px;color:#7a9060;background:#f0f5ec;border-radius:8px;padding:7px 10px;margin-bottom:8px;display:none}
.link-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.link-row input{flex:1}
.link-del{background:#fff0f0;border:1px solid #f0c0c0;border-radius:7px;padding:7px 9px;font-size:12px;cursor:pointer;color:#c05050;flex-shrink:0}
.add-link-btn{background:#f0f5ec;border:1px solid #c8ddb0;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;color:#4a5e4a;cursor:pointer;width:100%;margin-top:4px}
.pdf-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;background:#344f2c;color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
.detail-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f5f3ef;font-size:13px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:#8a8078;font-weight:600;width:80px;flex-shrink:0}
.detail-val{color:#3a3530;flex:1;word-break:break-all}
.detail-val a{color:#4a5e4a;text-decoration:none}
@media print{.header,.tabs,.plan-actions,.pdf-btn,.btn-new,.modal-overlay,.add-btn{display:none!important}.section{display:block!important}body{background:white}.card,.plan-card{break-inside:avoid;border:1px solid #ccc}}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <a href="/" class="back-btn">← 山を探す</a>
    <div class="header-title">Myページ</div>
  </div>
</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('plans')">📋 登山計画</div>
  <div class="tab" onclick="switchTab('favorites')">⭐ お気に入り</div>
  <div class="tab" onclick="switchTab('climbed')">🥾 登頂記録</div>
</div>
<div class="main">

  <!-- 登山計画 -->
  <div class="section active" id="tab-plans">
    <div id="plans-list"></div>
  </div>

  <!-- お気に入り -->
  <div class="section" id="tab-favorites">
    <div class="stat-row">
      <div class="stat-box"><div class="stat-num" id="fav-count">0</div><div class="stat-label">お気に入り</div></div>
      <div class="stat-box"><div class="stat-num" id="climbed-count">0</div><div class="stat-label">登頂数</div></div>
    </div>
    <div class="card">
      <div class="card-header">⭐ お気に入りの山</div>
      <div class="card-body" id="fav-list"></div>
    </div>
  </div>

  <!-- 登頂記録 -->
  <div class="section" id="tab-climbed">
    <button class="add-btn" onclick="openAddClimbed()">＋ 登頂記録を手動追加</button>
    <div class="card">
      <div class="card-header">🥾 登った山</div>
      <div class="card-body" id="climbed-list"></div>
    </div>
  </div>

</div>

<!-- 登山計画フォーム -->
<div class="modal-overlay" id="plan-form">
  <div class="modal">
    <div class="modal-header">
      <button class="modal-close" onclick="closePlanForm()">✕</button>
      <div class="modal-title" id="plan-form-title">新しい計画</div>
      <button class="modal-save" onclick="savePlan()">保存</button>
    </div>
    <div class="modal-body">
      <div class="form-card">
        <div class="form-card-title">📍 基本情報</div>
        <div class="field"><label>山名</label><input type="text" id="f-mountain" placeholder="例：谷川岳"></div>
        <div class="field"><label>日程</label><input type="date" id="f-date"></div>
        <div class="field"><label>集合場所</label><input type="text" id="f-place" placeholder="例：新宿駅南口"></div>
        <div class="field"><label>集合時間</label><input type="time" id="f-time"></div>
      </div>
      <div class="form-card">
        <div class="form-card-title">🔗 リンク集</div>
        <div class="field"><label>YAMAPルート</label><input type="url" id="f-yamap" placeholder="https://yamap.com/..."></div>
        <div class="field"><label>宿・テント場</label><input type="url" id="f-lodge" placeholder="https://..."></div>
        <div class="field"><label>温泉・お風呂</label><input type="url" id="f-onsen" placeholder="https://..."></div>
        <div class="field"><label>お店・グルメ</label><div id="shop-links"></div><button class="add-link-btn" onclick="addShopLink()">＋ お店を追加</button></div>
      </div>
      <div class="form-card">
        <div class="form-card-title">🎒 持ち物チェックリスト</div>
        <div id="copy-notice" class="copy-notice">前の計画の持ち物リストをコピーしました</div>
        <div class="tmpl-btns">
          <button class="tmpl-btn active" id="tmpl-day" onclick="applyTemplate('day')">日帰り</button>
          <button class="tmpl-btn" id="tmpl-stay" onclick="applyTemplate('stay')">宿泊</button>
        </div>
        <div class="checklist" id="checklist"></div>
        <div class="add-item-row">
          <input type="text" id="new-item-input" placeholder="持ち物を追加" onkeydown="if(event.key==='Enter')addCheckItem()">
          <button onclick="addCheckItem()">追加</button>
        </div>
      </div>
      <div class="form-card">
        <div class="form-card-title">📝 メモ</div>
        <div class="field"><textarea id="f-memo" placeholder="注意事項、駐車場情報など"></textarea></div>
      </div>
    </div>
  </div>
</div>

<!-- 計画詳細 -->
<div class="modal-overlay" id="plan-detail">
  <div class="modal">
    <div class="modal-header">
      <button class="modal-close" onclick="closePlanDetail()">✕</button>
      <div class="modal-title" id="detail-title">計画詳細</div>
      <button class="modal-save" onclick="window.print()" style="background:rgba(255,255,255,0.2)">PDF</button>
    </div>
    <div id="detail-body" style="padding:12px"></div>
  </div>
</div>

<!-- 手動登頂記録追加モーダル -->
<div class="modal-overlay" id="add-climbed-modal">
  <div class="modal">
    <div class="modal-header">
      <button class="modal-close" onclick="closeAddClimbed()">✕</button>
      <div class="modal-title">登頂記録を追加</div>
      <button class="modal-save" onclick="saveManualClimbed()">追加</button>
    </div>
    <div class="modal-body">
      <div class="form-card">
        <div class="field"><label>山名 <span style="color:#e05050">*</span></label><input type="text" id="mc-name" placeholder="例：雲取山"></div>
        <div class="field"><label>登頂日</label><input type="date" id="mc-date"></div>
        <div class="field"><label>エリア</label><input type="text" id="mc-area" placeholder="例：東京都・埼玉県"></div>
        <div class="field"><label>備考</label><textarea id="mc-memo" placeholder="天気、同行者、感想など"></textarea></div>
      </div>
    </div>
  </div>
</div>

<script>
const PLANS_KEY  = 'ym_plans';
const FAV_KEY    = 'ym_favorites';
const CLM_KEY    = 'ym_climbed';
const CLM_EX_KEY = 'ym_climbed_extra'; // 手動追加分

const TEMPLATE_DAY = [
  'レインウェア上下','行動食','水（500ml×2）','救急セット',
  '防寒着（フリース等）','ヘッドライト','トレッキングポール',
  '日焼け止め','サングラス','帽子','タオル','ザックカバー',
  'クマ鈴','モバイルバッテリー','虫除け',
  'チェーンスパイク','軽アイゼン（6本）',
];
const TEMPLATE_STAY = [
  'レインウェア上下','行動食（余裕を持って）','水（500ml×3）','救急セット',
  '防寒着（フリース等）','ヘッドライト','トレッキングポール',
  '日焼け止め','サングラス','帽子','タオル','ザックカバー',
  'クマ鈴','モバイルバッテリー','虫除け',
  'チェーンスパイク','軽アイゼン（6本）',
  '着替え','シュラフカバー','耳栓','洗面用具','サンダル',
];

let editingPlanIndex = null;
let currentItems = [];

// ===== 初期化 =====
function init() {
  renderPlans();
  renderFavorites();
  renderClimbed();
  // URLパラメータでタブ切替
  var hash = location.hash.replace('#','');
  if (hash === 'favorites') switchTab('favorites');
  else if (hash === 'climbed') switchTab('climbed');
}

// ===== タブ =====
function switchTab(name) {
  var names = ['plans','favorites','climbed'];
  document.querySelectorAll('.tab').forEach(function(t,i){ t.classList.toggle('active', names[i]===name); });
  document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById('tab-'+name).classList.add('active');
  location.hash = name === 'plans' ? '' : name;
}

// ===== 計画 =====
function getPlans(){ try{ return JSON.parse(localStorage.getItem(PLANS_KEY)||'[]'); }catch{ return []; } }
function savePlans(p){ localStorage.setItem(PLANS_KEY, JSON.stringify(p)); }

function renderPlans() {
  var plans = getPlans();
  var el = document.getElementById('plans-list');
  var html = '';
  if (plans.length < 2) html += '<button class="btn-new" onclick="openPlanForm(null)">＋ 新しい計画を作る</button>';
  if (plans.length === 0) {
    html += '<div class="empty">計画がまだありません<br><small>山を決めたら計画を作ってみよう</small></div>';
  } else {
    plans.forEach(function(p,i){
      var dateStr = p.date ? new Date(p.date).toLocaleDateString('ja-JP',{month:'long',day:'numeric'}) : '日程未定';
      var checked = (p.items||[]).filter(function(it){return it.checked;}).length;
      var total = (p.items||[]).length;
      html += '<div class="plan-card"><div class="plan-top">';
      html += '<div class="plan-name">'+(p.mountain||'山名未設定')+'</div>';
      html += '<div class="plan-date">📅 '+dateStr+(p.place?'　📍 '+p.place:'')+'</div>';
      html += '</div><div class="plan-body">';
      if (total>0) {
        html += '<div style="font-size:12px;color:#7a7068;margin-bottom:6px">持ち物 '+checked+'/'+total+'</div>';
        html += '<div style="height:4px;background:#f0ede5;border-radius:2px;margin-bottom:10px;overflow:hidden"><div style="width:'+Math.round(checked/total*100)+'%;height:100%;background:#4a5e4a;border-radius:2px"></div></div>';
      }
      html += '<div class="plan-actions">';
      html += '<button class="btn btn-outline" onclick="openPlanDetail('+i+')">詳細</button>';
      html += '<button class="btn btn-primary" onclick="openPlanForm('+i+')">編集</button>';
      html += '<button class="btn btn-danger" onclick="deletePlan('+i+')">削除</button>';
      html += '</div></div></div>';
    });
  }
  el.innerHTML = html;
}

function openPlanForm(index) {
  editingPlanIndex = index;
  var plans = getPlans();
  var p = index!==null ? plans[index] : null;
  document.getElementById('plan-form-title').textContent = index!==null?'計画を編集':'新しい計画';
  document.getElementById('f-mountain').value = p?(p.mountain||''):'';
  document.getElementById('f-date').value = p?(p.date||''):'';
  document.getElementById('f-place').value = p?(p.place||''):'';
  document.getElementById('f-time').value = p?(p.time||''):'';
  document.getElementById('f-yamap').value = p?(p.yamap||''):'';
  document.getElementById('f-lodge').value = p?(p.lodge||''):'';
  document.getElementById('f-onsen').value = p?(p.onsen||''):'';
  document.getElementById('f-memo').value = p?(p.memo||''):'';
  renderShopLinks(p?p.shops||[]:[]);
  var cn = document.getElementById('copy-notice');
  cn.style.display = 'none';
  if (p && p.items && p.items.length>0) {
    currentItems = p.items.map(function(it){return Object.assign({},it);});
  } else if (index===null && plans.length>0) {
    var prev = plans[plans.length-1].items||[];
    if (prev.length>0){ currentItems=prev.map(function(it){return{label:it.label,checked:false};}); cn.style.display='block'; }
    else { currentItems = TEMPLATE_DAY.map(function(s){return{label:s,checked:false};}); }
  } else {
    currentItems = TEMPLATE_DAY.map(function(s){return{label:s,checked:false};});
  }
  renderChecklist();
  document.getElementById('tmpl-day').classList.add('active');
  document.getElementById('tmpl-stay').classList.remove('active');
  document.getElementById('plan-form').classList.add('open');
}
function closePlanForm(){ document.getElementById('plan-form').classList.remove('open'); }

function savePlan() {
  var plans = getPlans();
  var shops = [];
  document.querySelectorAll('.shop-input').forEach(function(inp){if(inp.value.trim())shops.push(inp.value.trim());});
  var p = {
    mountain: document.getElementById('f-mountain').value.trim(),
    date: document.getElementById('f-date').value,
    place: document.getElementById('f-place').value.trim(),
    time: document.getElementById('f-time').value,
    yamap: document.getElementById('f-yamap').value.trim(),
    lodge: document.getElementById('f-lodge').value.trim(),
    onsen: document.getElementById('f-onsen').value.trim(),
    shops: shops, memo: document.getElementById('f-memo').value.trim(),
    items: currentItems.slice(),
  };
  if (editingPlanIndex!==null) plans[editingPlanIndex]=p; else plans.push(p);
  savePlans(plans); closePlanForm(); renderPlans();
}

function deletePlan(i) {
  if (!confirm('この計画を削除しますか？')) return;
  var plans = getPlans(); plans.splice(i,1); savePlans(plans); renderPlans();
}

// ===== 計画詳細 =====
function openPlanDetail(index) {
  var p = getPlans()[index]; if(!p) return;
  document.getElementById('detail-title').textContent = p.mountain||'計画詳細';
  var dateStr = p.date ? new Date(p.date).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'}) : '未定';
  var html = '';
  html += '<div class="card" style="margin-bottom:10px"><div class="card-header">📍 基本情報</div><div class="card-body">';
  html += dr('山名',p.mountain||'未設定')+dr('日程',dateStr)+dr('集合場所',p.place||'未設定')+dr('集合時間',p.time||'未設定');
  html += '</div></div>';
  var hasLinks = p.yamap||p.lodge||p.onsen||(p.shops&&p.shops.length>0);
  if (hasLinks) {
    html += '<div class="card" style="margin-bottom:10px"><div class="card-header">🔗 リンク集</div><div class="card-body">';
    if(p.yamap) html+=dr('YAMAPルート','<a href="'+esc(p.yamap)+'" target="_blank">ルートを開く →</a>');
    if(p.lodge) html+=dr('宿','<a href="'+esc(p.lodge)+'" target="_blank">開く →</a>');
    if(p.onsen) html+=dr('温泉','<a href="'+esc(p.onsen)+'" target="_blank">開く →</a>');
    (p.shops||[]).forEach(function(s,i){ html+=dr('お店'+(p.shops.length>1?' '+(i+1):''),'<a href="'+esc(s)+'" target="_blank">開く →</a>'); });
    html += '</div></div>';
  }
  if (p.items&&p.items.length>0) {
    html += '<div class="card" style="margin-bottom:10px"><div class="card-header">🎒 持ち物</div><div class="card-body"><div class="checklist">';
    p.items.forEach(function(item,i){
      html += '<div class="check-item'+(item.checked?' checked':'')+'"><input type="checkbox"'+(item.checked?' checked':'')+' onchange="toggleDetailCheck('+index+','+i+',this.checked)"><span class="item-label">'+esc(item.label)+'</span></div>';
    });
    html += '</div></div></div>';
  }
  if(p.memo) html += '<div class="card" style="margin-bottom:10px"><div class="card-header">📝 メモ</div><div class="card-body" style="font-size:13px;line-height:1.7;white-space:pre-wrap">'+esc(p.memo)+'</div></div>';
  html += '<button class="pdf-btn" onclick="window.print()">📄 PDFとして保存</button>';
  document.getElementById('detail-body').innerHTML = html;
  document.getElementById('plan-detail').classList.add('open');
}
function closePlanDetail(){ document.getElementById('plan-detail').classList.remove('open'); }

function toggleDetailCheck(pi,ii,val) {
  var plans=getPlans(); if(plans[pi]&&plans[pi].items&&plans[pi].items[ii]){plans[pi].items[ii].checked=val;savePlans(plans);renderPlans();openPlanDetail(pi);}
}

function dr(label,val){ return '<div class="detail-row"><div class="detail-label">'+label+'</div><div class="detail-val">'+val+'</div></div>'; }

// ===== お気に入り =====
function getFavs(){ try{return JSON.parse(localStorage.getItem(FAV_KEY)||'[]');}catch{return[];} }
function saveFavs(f){ localStorage.setItem(FAV_KEY, JSON.stringify(f)); }

function renderFavorites() {
  var favs = getFavs();
  var climbs = getClimbs();
  document.getElementById('fav-count').textContent = favs.length;
  document.getElementById('climbed-count').textContent = Object.keys(climbs).length;
  var el = document.getElementById('fav-list');
  if (favs.length===0){ el.innerHTML='<div class="empty">お気に入りの山がありません<br><small>山カードの ☆ で追加できます</small></div>'; return; }
  fetchNames(function(nameMap){
    var html = '';
    favs.forEach(function(id){
      var name = nameMap[id]||id;
      html += '<div class="list-item">';
      html += '<div><div class="list-item-name"><a href="/mountains/'+id+'/" style="color:#3a3530;text-decoration:none">'+esc(name)+'</a></div></div>';
      html += '<button class="del-btn" onclick="removeFav(\''+id+'\')">削除</button>';
      html += '</div>';
    });
    el.innerHTML = html;
  });
}

function removeFav(id) {
  var favs = getFavs().filter(function(f){return f!==id;});
  saveFavs(favs); renderFavorites();
  // トップ画面のfavoritesと同期（同一localStorage）
}

// ===== 登頂記録 =====
function getClimbs(){
  // ym_climbedはMap形式[id,date]の配列、ym_climbed_extraは手動追加
  var base={};
  try{
    var arr = JSON.parse(localStorage.getItem(CLM_KEY)||'[]');
    arr.forEach(function(e){base[e[0]]={type:'site',name:null,date:e[1],area:'',memo:''};});
  }catch{}
  try{
    var extra = JSON.parse(localStorage.getItem(CLM_EX_KEY)||'[]');
    extra.forEach(function(e,i){base['__extra_'+i]={type:'manual',name:e.name,date:e.date,area:e.area,memo:e.memo};});
  }catch{}
  return base;
}

function renderClimbed() {
  var climbs = getClimbs();
  var keys = Object.keys(climbs).sort(function(a,b){
    return (climbs[b].date||'').localeCompare(climbs[a].date||'');
  });
  document.getElementById('climbed-count').textContent = keys.length;
  var el = document.getElementById('climbed-list');
  if (keys.length===0){ el.innerHTML='<div class="empty">登頂記録がありません<br><small>山カードの 🥾 ボタンで記録できます</small></div>'; return; }
  fetchNames(function(nameMap){
    var html = '';
    keys.forEach(function(k){
      var c = climbs[k];
      var name = c.type==='manual' ? c.name : (nameMap[k]||k);
      var date = c.date ? new Date(c.date.replace(/\//g,'-')).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'}) : '';
      html += '<div class="list-item">';
      html += '<div style="flex:1">';
      html += '<div class="list-item-name">';
      if (c.type==='site') html += '<a href="/mountains/'+k+'/" style="color:#3a3530;text-decoration:none">'+esc(name)+'</a>';
      else html += esc(name);
      if (c.type==='manual') html += ' <span style="font-size:10px;color:#8a8078;background:#f0ede5;padding:1px 5px;border-radius:4px">手動</span>';
      html += '</div>';
      if (date) html += '<div class="list-item-sub">'+date+'</div>';
      if (c.area) html += '<div class="list-item-sub">📍 '+esc(c.area)+'</div>';
      if (c.memo) html += '<div class="list-item-sub" style="white-space:pre-wrap">'+esc(c.memo)+'</div>';
      html += '</div>';
      html += '<button class="del-btn" onclick="removeClimbed(\''+k+'\')">削除</button>';
      html += '</div>';
    });
    el.innerHTML = html;
  });
}

function removeClimbed(key) {
  if (!confirm('この登頂記録を削除しますか？')) return;
  if (key.startsWith('__extra_')) {
    // 手動追加分
    var idx = parseInt(key.replace('__extra_',''));
    try{
      var extra = JSON.parse(localStorage.getItem(CLM_EX_KEY)||'[]');
      extra.splice(idx,1);
      localStorage.setItem(CLM_EX_KEY, JSON.stringify(extra));
    }catch{}
  } else {
    // サイト内の記録
    try{
      var arr = JSON.parse(localStorage.getItem(CLM_KEY)||'[]');
      arr = arr.filter(function(e){return e[0]!==key;});
      localStorage.setItem(CLM_KEY, JSON.stringify(arr));
    }catch{}
  }
  renderClimbed(); renderFavorites();
}

// ===== 手動登頂追加 =====
function openAddClimbed(){
  document.getElementById('mc-name').value='';
  document.getElementById('mc-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('mc-area').value='';
  document.getElementById('mc-memo').value='';
  document.getElementById('add-climbed-modal').classList.add('open');
}
function closeAddClimbed(){ document.getElementById('add-climbed-modal').classList.remove('open'); }
function saveManualClimbed(){
  var name = document.getElementById('mc-name').value.trim();
  if (!name){ alert('山名を入力してください'); return; }
  try{
    var extra = JSON.parse(localStorage.getItem(CLM_EX_KEY)||'[]');
    extra.push({name:name, date:document.getElementById('mc-date').value, area:document.getElementById('mc-area').value.trim(), memo:document.getElementById('mc-memo').value.trim()});
    localStorage.setItem(CLM_EX_KEY, JSON.stringify(extra));
  }catch{}
  closeAddClimbed(); renderClimbed(); renderFavorites();
}

// ===== 持ち物 =====
function applyTemplate(type){
  currentItems=(type==='stay'?TEMPLATE_STAY:TEMPLATE_DAY).map(function(s){return{label:s,checked:false};});
  renderChecklist();
  document.getElementById('tmpl-day').classList.toggle('active',type==='day');
  document.getElementById('tmpl-stay').classList.toggle('active',type==='stay');
}
function renderChecklist(){
  var el=document.getElementById('checklist');
  if(!currentItems.length){el.innerHTML='';return;}
  el.innerHTML=currentItems.map(function(item,i){
    return '<div class="check-item'+(item.checked?' checked':'')+'"><input type="checkbox"'+(item.checked?' checked':'')+' onchange="toggleCheck('+i+',this.checked)"><span class="item-label" onclick="toggleCheck('+i+',!currentItems['+i+'].checked)">'+esc(item.label)+'</span><button class="item-del" onclick="removeItem('+i+')">×</button></div>';
  }).join('');
}
function toggleCheck(i,val){
  currentItems[i].checked=val; renderChecklist();
  if(editingPlanIndex!==null){var plans=getPlans();if(plans[editingPlanIndex]){plans[editingPlanIndex].items=currentItems.slice();savePlans(plans);renderPlans();}}
}
function removeItem(i){ currentItems.splice(i,1); renderChecklist(); }
function addCheckItem(){
  var inp=document.getElementById('new-item-input');
  var v=inp.value.trim(); if(!v) return;
  currentItems.push({label:v,checked:false}); renderChecklist(); inp.value=''; inp.focus();
}

// ===== お店リンク =====
function renderShopLinks(links){
  document.getElementById('shop-links').innerHTML=links.map(function(link,i){
    return '<div class="link-row"><input type="url" class="shop-input" value="'+esc(link)+'" placeholder="https://..."><button class="link-del" onclick="removeShopLink('+i+')">✕</button></div>';
  }).join('');
}
function addShopLink(){ var l=[]; document.querySelectorAll('.shop-input').forEach(function(i){l.push(i.value);}); l.push(''); renderShopLinks(l); }
function removeShopLink(i){ var l=[]; document.querySelectorAll('.shop-input').forEach(function(inp){l.push(inp.value);}); l.splice(i,1); renderShopLinks(l); }

// ===== 山名取得 =====
var _nameMap=null;
function fetchNames(cb){
  if(_nameMap){cb(_nameMap);return;}
  fetch('/data/mountains.json').then(function(r){return r.json();}).then(function(data){
    _nameMap={};data.forEach(function(m){_nameMap[m.id]=m.name;});cb(_nameMap);
  }).catch(function(){cb({});});
}

function esc(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
