# サイトの整合性チェック。プッシュのたびと、週に1回、scripts/check_pages.py を実行する。
# 異常があると失敗になり、GitHub から運営者にメールが届く。データやページは書き換えない
# （マイページの運営者向けのお知らせ data/admin_notices.json だけを更新する）。
name: サイトのチェック

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 1'   # 毎週月曜 9:00（日本時間）
  workflow_dispatch:

permissions:
  contents: write   # マイページのお知らせ（data/admin_notices.json）だけをコミットする
  actions: read     # 定期実行が止まっていないかを見る（毎日の見張りが止まったときに気づくため）

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check_pages.py（17セクション）
        run: |
          set +e
          python3 scripts/check_pages.py > check_pages_report.txt 2>&1
          code=$?
          grep "^## " check_pages_report.txt
          echo "----"
          grep -v "（0件）" check_pages_report.txt | head -n 200
          echo "$code" > check_code.txt
          exit $code
      - name: マイページのお知らせを更新する
        if: always()
        run: |
          git config user.name "yamatch-admin-notice"
          git config user.email "actions@users.noreply.github.com"
          # 最新の状態の上にお知らせを作り直して送る（ほかの定期実行と同じ行を書き換えてぶつかるため。2026-11-15）
          bash scripts/git_publish.sh "運営者向けのお知らせを更新（サイトの検証）" 'python3 scripts/admin_notice.py --kind sitecheck --report check_pages_report.txt --code "$(cat check_code.txt)"' data/admin_notices.json
      # 定期実行が止まっていないかを見る（毎日の見張り restriction-watch.yml でも見ている。その見張り自体が止まったときに気づくため、ここでも見る）
      - name: 定期実行が止まっていないかを見る
        id: health
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/check_workflows_health.py --out health_report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: マイページのお知らせを更新する（定期実行）
        if: always()
        run: |
          git config user.name "yamatch-admin-notice"
          git config user.email "actions@users.noreply.github.com"
          # 最新の状態の上にお知らせを作り直して送る（ほかの定期実行と同じ行を書き換えてぶつかるため。2026-11-15）
          bash scripts/git_publish.sh "運営者向けのお知らせを更新（定期実行の見張り）" 'python3 scripts/admin_notice.py --kind health --report health_report.md --code "${{ steps.health.outputs.code }}"' data/admin_notices.json
