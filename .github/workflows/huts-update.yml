# 山小屋まとめ（β）の定期更新。出典（長野県の山小屋ポータル・山と溪谷オンラインの山小屋リスト）を取り直し、
# 営業期間などの記載が変わっていれば data/huts.json と huts/index.html を更新してコミットする。
# 決まった手順のスクリプトだけで動く（AIは使わない）。予約の開始日・方法・規模は人が確認した値で、自動では書き換えない
# （出典や公式ページの記載が変わった小屋は、ページ上で「確認中」に切り替わる）。
name: 山小屋まとめの定期更新

on:
  schedule:
    - cron: '0 21 * * *'   # 毎日 6:00（日本時間）。実際に見に行くかどうかは update_huts.py --scheduled が決める
                           #   毎月1日＝全小屋／発表が出そうな期間の小屋＝3日に1回／一覧の出典＝4〜6月は3日に1回／それ以外の日は何もしない
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 出典を取り直して更新する
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}     # Instagram の投稿を読むための鍵（未設定のあいだは読まない）
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/update_huts.py --scheduled --out huts_report.md
      - name: Instagram の見張り（Meta AI が書き込むスプレッドシート）を読む
        run: |
          set +e
          python3 scripts/huts_meta_sheet.py --out insta_report.md
          echo "$?" > insta_code.txt
          python3 scripts/admin_notice.py --kind insta --report insta_report.md --code "$(cat insta_code.txt)"
          exit 0
      - name: サイトのチェック
        run: python3 scripts/check_pages.py > check_pages_report.txt 2>&1 || (tail -n 40 check_pages_report.txt; exit 1)
      - name: 変わっていればコミットする
        run: |
          git config user.name "yamatch-huts-update"
          git config user.email "actions@users.noreply.github.com"
          # 最新の状態の上に、山小屋のデータを乗せ直し、お知らせ（Instagram の見張り・山小屋の定期更新）を作り直して送る。
          # 前は「コミット → git pull --rebase → push」で、ほかの定期実行（予約開始の通知など）が同じ朝にお知らせのファイルの
          # 同じ行を書き換えるため取り込みがぶつかり、2026-10〜11 に35回中20回失敗していた（2026-11-15 に直した）
          bash scripts/git_publish.sh "山小屋まとめを更新（出典の取り直し）" \
            'python3 scripts/admin_notice.py --kind insta --report insta_report.md --code "$(cat insta_code.txt 2>/dev/null || echo 0)"; python3 scripts/admin_notice.py --kind huts --report huts_report.md' \
            data/huts.json data/huts_history.json data/huts_rules.json huts sitemap.xml data/huts_meta_seen.json data/admin_notices.json
          cat huts_report.md
