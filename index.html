function parseTimeToMinutes(timeStr) {
  const hMatch = timeStr.match(/(\d+)時間/);
  const mMatch = timeStr.match(/(\d+)分/);
  const h = hMatch ? parseInt(hMatch[1]) : 0;
  const m = mMatch ? parseInt(mMatch[1]) : 0;
  return h * 60 + m;
}

function isDayTrip(mountain) {
  return mountain.routes.some(r => parseTimeToMinutes(r.time) <= 480);
}

function formatDriveTime(min) {
  if (min < 60) return `${min}分`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return m === 0 ? `${h}時間` : `${h}時間${m}分`;
}


function MapView({ mountains, onSelect }) {
  const mapRef = useRef(null);
  const mapInstanceRef = useRef(null);
  const markersRef = useRef([]);
  const [mapReady, setMapReady] = useState(false);

  const filtered = mountains; // 呼び出し元でフィルター済み

  // cdnjsからLeafletをロード（Artifact環境で動作）
  useEffect(() => {
    if (window.L) { setMapReady(true); return; }

    const cssId = "leaflet-css";
    if (!document.getElementById(cssId)) {
      const link = document.createElement("link");
      link.id = cssId;
      link.rel = "stylesheet";
      link.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
      document.head.appendChild(link);
    }

    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    script.onload = () => setMapReady(true);
    script.onerror = () => console.error("Leaflet load failed");
    document.head.appendChild(script);
  }, []);

  // 地図初期化
  useEffect(() => {
    if (!mapReady || !mapRef.current || mapInstanceRef.current) return;
    const L = window.L;
    const map = L.map(mapRef.current, { zoomControl: true }).setView([36.3, 138.5], 7);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a>",
      maxZoom: 18,
    }).addTo(map);
    mapInstanceRef.current = map;
  }, [mapReady]);

  // マーカー更新
  useEffect(() => {
    if (!mapReady || !mapInstanceRef.current) return;
    const L = window.L;
    const map = mapInstanceRef.current;

    markersRef.current.forEach(m => m.remove());
    markersRef.current = [];

    filtered.forEach(mountain => {
      if (!mountain.lat || !mountain.lng) return;
      const dayTrip = isDayTrip(mountain);
      const color = dayTrip ? "#15803d" : "#b45309";

      const icon = L.divIcon({
        className: "",
        html: `<div style="width:30px;height:30px;border-radius:50%;background:${color};border:2.5px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;color:white;font-size:13px;cursor:pointer;">⛰</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -18],
      });

      const marker = L.marker([mountain.lat, mountain.lng], { icon }).addTo(map);
      marker.bindPopup(`
        <div style="min-width:170px;font-family:sans-serif;padding:2px;">
          <div style="font-weight:bold;font-size:14px;margin-bottom:4px;">${mountain.name}</div>
          <div style="font-size:12px;color:#555;">${mountain.elevation.toLocaleString()}m ・ ${mountain.area}</div>
          <div style="font-size:11px;color:#777;margin-top:3px;">🚗 ${formatDriveTime(mountain.driveTime)}</div>
          <div style="font-size:11px;margin-top:3px;font-weight:600;color:${dayTrip ? "#15803d" : "#b45309"};">${dayTrip ? "🌅 日帰り可" : "🏕 宿泊推奨"}</div>
          <button id="btn-${mountain.id}" style="margin-top:8px;width:100%;padding:7px;background:#1a3d2b;color:white;border:none;border-radius:7px;font-size:12px;cursor:pointer;font-weight:bold;">詳細を見る →</button>
        </div>
      `);
      marker.on("popupopen", () => {
        setTimeout(() => {
          const btn = document.getElementById("btn-" + mountain.id);
          if (btn) btn.onclick = () => onSelect(mountain.id);
        }, 50);
      });
      markersRef.current.push(marker);
    });
  }, [mapReady, filtered, onSelect]);

  return (
    <div style={{ position: "relative" }}>
      {!mapReady && (
        <div style={{ height: 460, borderRadius: 12, background: "#e8f0e9", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 8 }}>
          <div style={{ fontSize: 32 }}>🗺️</div>
          <div style={{ color: "#555", fontSize: 14 }}>地図を読み込み中...</div>
        </div>
      )}
      <div ref={mapRef} style={{ height: 460, borderRadius: 12, overflow: "hidden", display: mapReady ? "block" : "none" }} />
      <div style={{
        position: "absolute", bottom: 12, left: 12, zIndex: 1000,
        background: "white", borderRadius: 8, padding: "8px 12px",
        boxShadow: "0 2px 8px rgba(0,0,0,0.15)", fontSize: 11,
        display: "flex", flexDirection: "column", gap: 5
      }}>
        <div style={{ fontWeight: "bold", marginBottom: 2, color: "#333" }}>凡例</div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <div style={{ width: 12, height: 12, borderRadius: "50%", background: "#15803d" }} />
          <span>日帰り可（8h以内）</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <div style={{ width: 12, height: 12, borderRadius: "50%", background: "#b45309" }} />
          <span>宿泊推奨</span>
        </div>
      </div>
    </div>
  );
}

function CourseMeter({ range }) {
  const [min, max] = range;
  const pct = (v) => (v / 70) * 100;
  return (
    <div className="relative h-2 bg-gray-200 rounded-full my-2">
      <div
        className="absolute h-2 rounded-full"
        style={{
          left: `${pct(min)}%`,
          width: `${pct(max) - pct(min)}%`,
          backgroundColor: max >= 40 ? "#8a4040" : max >= 25 ? "#8a6830" : "#4a6840",
        }}
      />
      {[0, 10, 20, 30, 40, 50, 60, 70].map(v => (
        <span key={v} className="absolute text-xs text-gray-400" style={{ left: `${pct(v)}%`, top: "10px", transform: "translateX(-50%)" }}>{v}</span>
      ))}
    </div>
  );
}

function GearBadge({ mountain, month }) {
  const noGear = canClimbNoGear(mountain, month);

}

// コース定数の体力度バッジ
function CourseBadge({ courseCoefficient, courseCoefficientRange }) {
  const max = courseCoefficient[1];
  const bg = max >= 25 ? "#f0e0e0" : max >= 16 ? "#f0ece0" : "#e8f0e4";
  const color = max >= 25 ? "#7a3838" : max >= 16 ? "#7a6030" : "#4a6840";
  return (
    <span className="text-xs font-semibold px-1.5 py-0.5 rounded"
      style={{ backgroundColor: bg, color }}>
      {courseCoefficientRange}
    </span>
  );
}

// 月テキストから月数値配列を抽出するヘルパー
function parseMonthRange(text) {
  if (!text || text === "通年" || text === "なし") return null;
  if (text.startsWith("不可")) return [];
  // 「上旬」「中旬」「下旬」などを除去して純粋な月文字列にする
  const cleaned = text.replace(/[上中下]旬/g, "").replace(/頃/g, "");
  const months = [];
  const parts = cleaned.split(/[・、]/);
  for (const part of parts) {
    const rangeMatch = part.match(/(\d+)月〜(\d+)月/);
    if (rangeMatch) {
      const s = Number(rangeMatch[1]);
      const e = Number(rangeMatch[2]);
      if (s <= e) { for (let i = s; i <= e; i++) months.push(i); }
      else { for (let i = s; i <= 12; i++) months.push(i); for (let i = 1; i <= e; i++) months.push(i); }
    } else {
      const single = part.match(/(\d+)月/);
      if (single) months.push(Number(single[1]));
    }
  }
  return months.length > 0 ? months : [];
}

function canClimbNoGear(m, month) {
  const months = parseMonthRange(m.seasonNoGear);
  if (months === null) return true; // 通年
  return months.includes(month);
}

function canClimb6Crampons(m, month) {
  const noGearMonths = parseMonthRange(m.seasonNoGear);
  if (noGearMonths === null) return true;
  if (noGearMonths.includes(month)) return true;
  const months = parseMonthRange(m.season6Crampons);
  if (!months || months.length === 0) return false;
  return months.includes(month);
}

function App() {

  const getDriveTime = (m) => {
    if (departure === "新宿" && m.driveTimeShinjuku) return m.driveTimeShinjuku;

                <h1 style={{fontFamily:"Georgia,serif",fontSize:"23px",fontWeight:"700",color:"white",lineHeight:1,margin:0}}>Yamatch</h1>

              <a href="/about/" style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)",color:"white",borderRadius:"7px",padding:"4px 9px",fontSize:"10px",textDecoration:"none",flexShrink:0}}>運営者</a>
              <button onClick={() => setShowBoard(true)} style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.15)",color:"white",borderRadius:"7px",padding:"4px 9px",fontSize:"10px",cursor:"pointer",flexShrink:0}}>提案</button>
            </div>
            {/* キャッチコピー */}
            <div style={{position:"relative",zIndex:1,marginBottom:"14px"}}>
              <div style={{fontSize:"clamp(15px,4vw,20px)",fontWeight:"700",color:"white",lineHeight:1.35,letterSpacing:"-0.01em",marginBottom:"5px"}}>出発地から、<span style={{color:"#b8e090",fontWeight:"800"}}>次登る山</span>を見つけよう</div>
              <div style={{fontSize:"11px",color:"rgba(255,255,255,0.48)",lineHeight:1.65}}>アクセス時間・難易度・体力で絞り込める登山サーチ</div>
            </div>
            {/* 出発地タブ */}
            <div style={{position:"relative",zIndex:1}}>
              <div style={{display:"flex",background:"rgba(0,0,0,0.18)",borderRadius:"10px",padding:"3px",marginBottom:"14px"}}>
                {["大船","新宿","横浜","大宮"].map(d => (
                  <button key={d} onClick={() => setDeparture(d)}
                    style={{flex:1,textAlign:"center",fontSize:"12px",color:departure===d?"#2d4a28":"rgba(255,255,255,0.42)",background:departure===d?"white":"transparent",padding:"6px 4px",borderRadius:"7px",fontWeight:departure===d?"700":"500",border:"none",cursor:"pointer",transition:"all 0.15s"}}>
                    {d}駅
                  </button>
                ))}
              </div>
            </div>
          </div>
        </header>
        <main className="max-w-2xl mx-auto p-4">
          <MountainDetail mountain={mountain} onBack={() => setSelected(null)} onReport={(name) => { setBoardInitMountain(name); setShowBoard(true); }} departure={departure} />
        </main>
      </div>
    );
  }

  return (
    <div style={{ background: "#f8f7f4", minHeight: "100vh", fontFamily: "sans-serif" }}>

                <span style={{fontFamily:"Georgia,serif",fontSize:"16px",fontWeight:"700",color:"#3a3530"}}>Yamatch</span>
              </div>

              {[
                {label:"🏠 ホーム",href:"/"},

                {label:"ℹ️ 運営者について",href:"/about/"},
                {label:"📜 利用規約",href:"/terms/"},
                {label:"🔒 プライバシーポリシー",href:"/privacy/"},
              ].map(item => (
                <a key={item.label} href={item.href} style={{display:"flex",alignItems:"center",padding:"15px 20px",fontSize:"14px",color:"#3a3530",textDecoration:"none",borderBottom:"1px solid #f0ede5",fontWeight:"500"}}>{item.label}</a>
              ))}
              <a href="https://forms.gle/qsXvFTcj6H1TM7ra7" target="_blank" rel="noopener" style={{display:"flex",alignItems:"center",padding:"15px 20px",fontSize:"14px",color:"#3a3530",textDecoration:"none",borderBottom:"1px solid #f0ede5",fontWeight:"500"}}>💬 改善提案・情報修正</a>

          <div style={{display:"flex",gap:"5px"}}>
            <button onClick={() => { if(navigator.share){ navigator.share({title:"Yamatch",url:location.href}); } else { navigator.clipboard.writeText(location.href).then(()=>alert("URLをコピーしました")); } }} style={{width:"34px",height:"34px",borderRadius:"8px",background:"rgba(255,255,255,0.14)",border:"0.5px solid rgba(255,255,255,0.25)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>

              </div>
              <div style={{background:"rgba(255,255,255,0.93)",borderRadius:"8px",height:"30px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 8px",flexShrink:0}}>

                <div style={{display:"flex",alignItems:"center",gap:"1px"}}>

const root=ReactDOM.createRoot(document.getElementById('root'));

// JSONから最新データを読み込んでからレンダリング
fetch('/data/mountains.json')
  .then(function(r){ return r.json(); })
  .then(function(jsonData){
    jsonData.forEach(function(jmt){
      var idx = mountains.findIndex(function(m){ return m.id === jmt.id; });
      if(idx < 0) return;
      var m = mountains[idx];
      if(jmt.driveOfuna) m.driveTime = jmt.driveOfuna;
      if(jmt.driveShinjuku) m.driveTimeShinjuku = jmt.driveShinjuku;
      if(jmt.driveYokohama) m.driveTimeYokohama = jmt.driveYokohama;
      if(jmt.driveOmiya) m.driveTimeOmiya = jmt.driveOmiya;
      if(jmt.coeffMin && jmt.coeffMax){
        m.courseCoefficient = [jmt.coeffMin, jmt.coeffMax];
        m.courseCoefficientRange = jmt.coeffMin + '〜' + jmt.coeffMax;
      }
    });
  })
  .catch(function(){})
  .finally(function(){
    root.render(<App/>);
    const _sk=document.getElementById('app-skeleton');if(_sk)_sk.style.display='none';
  });

</script></body></html>
